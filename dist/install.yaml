kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: gke-gen4-np-migrator
  name: gke-gen4-np-migrator-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gke-gen4-np-migrator-metrics-auth-role
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gke-gen4-np-migrator-metrics-reader
rules:
- nonResourceURLs:
  - /metrics
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: gke-gen4-np-migrator
  name: gke-gen4-np-migrator-leader-election-rolebinding
  namespace: gke-gen4-np-migrator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gke-gen4-np-migrator-leader-election-role
subjects:
- kind: ServiceAccount
  name: gke-gen4-np-migrator-controller-manager
  namespace: gke-gen4-np-migrator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: gke-gen4-np-migrator
  name: gke-gen4-np-migrator-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gke-gen4-np-migrator-manager-role
subjects:
- kind: ServiceAccount
  name: gke-gen4-np-migrator-controller-manager
  namespace: gke-gen4-np-migrator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gke-gen4-np-migrator-metrics-auth-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gke-gen4-np-migrator-metrics-auth-role
subjects:
- kind: ServiceAccount
  name: gke-gen4-np-migrator-controller-manager
  namespace: gke-gen4-np-migrator-system
---
apiVersion: v1
data:
  OLD_STORAGE_CLASSES: standard,standard-rwo,standard-rwx
  STORAGE_CLASSNAME: hyper-balanced
  VOLUME_SNAPHOT_CLASS: csi-gcs-snapshotter
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: gke-gen4-np-migrator
    control-plane: controller-manager
  name: gke-gen4-np-migrator-gke-np-migrator-config
  namespace: gke-gen4-np-migrator-system
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: gke-gen4-np-migrator
    control-plane: controller-manager
  name: gke-gen4-np-migrator-controller-manager-metrics-service
  namespace: gke-gen4-np-migrator-system
spec:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  selector:
    app.kubernetes.io/name: gke-gen4-np-migrator
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: gke-gen4-np-migrator
    control-plane: controller-manager
  name: gke-gen4-np-migrator-controller-manager
  namespace: gke-gen4-np-migrator-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gke-gen4-np-migrator
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: gke-gen4-np-migrator
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --metrics-bind-address=:8443
        - --leader-elect
        - --health-probe-bind-address=:8081
        command:
        - /manager
        envFrom:
        - configMapRef:
            name: gke-gen4-np-migrator-gke-np-migrator-config
        image: controller:latest
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts: []
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: gke-gen4-np-migrator-controller-manager
      terminationGracePeriodSeconds: 10
      volumes: []
---
apiVersion: snapshot.storage.k8s.io/v1
deletionPolicy: Retain
driver: pd.csi.storage.gke.io
kind: VolumeSnapshotClass
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: gke-gen4-np-migrator
  name: gke-gen4-np-migrator-csi-hostpath-snapclass
  namespace: gke-gen4-np-migrator-system
parameters:
  storage-locations: us-central1
  type: regional
