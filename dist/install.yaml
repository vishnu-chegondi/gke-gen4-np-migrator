apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: gke-gen4-np-migrator
    control-plane: controller-manager
  name: gke-gen4-np-migrator-system
---
allowVolumeExpansion: true
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gke-gen4-np-migrator-hyperdisk-balanced-sc
parameters:
  provisioned-iops-on-create: "7000"
  provisioned-throughput-on-create: 250Mi
  type: hyperdisk-balanced
provisioner: pd.csi.storage.gke.io
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: gke-gen4-np-migrator
  name: gke-gen4-np-migrator-controller-manager
  namespace: gke-gen4-np-migrator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: gke-gen4-np-migrator
  name: gke-gen4-np-migrator-leader-election-role
  namespace: gke-gen4-np-migrator-system
